[package]
name = "agentz-task-state"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Durable task/environment identity independent of the desktop framework"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
