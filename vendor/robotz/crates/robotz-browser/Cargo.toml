[package]
name = "robotz-browser"
description = "Chrome DevTools Protocol web automation tool for RobotZ"
version = "0.1.15"
edition = "2021"
license = "Apache-2.0"
authors = ["Piscis Team"]
rust-version = "1.77.2"

[dependencies]
robotz-core = { path = "../robotz-core" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
base64 = "0.22"
futures = "0.3"
once_cell = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
# Browser automation via Chrome DevTools Protocol (cross-platform).
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }
# HTTP client for downloading Chrome for Testing.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
# ZIP extraction for Chrome for Testing downloads.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Vendored at v0.8.79 (upstream robotz-browser pins v0.8.68); the Tool trait is
# compatible and the workspace patch below resolves both to this source.
piscis-kernel = { git = "https://github.com/njbinbin-piscis/piscis-engine.git", package = "piscis-kernel", rev = "v0.8.80", optional = true }

[features]
default = []
piscis-kernel = ["dep:piscis-kernel"]

# Match the AgentZ workspace lint policy (the upstream RobotZ workspace had the
# same table; flattening the manifest dropped it, letting Linux-only clippy
# warnings slip through CI's `-D warnings`).
[lints.rust]
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
needless_return = "allow"
module_inception = "allow"
too_many_arguments = "allow"
