name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  RUST_BACKTRACE: 1
  # `vite build` of the heavy frontend (mermaid / monaco / katex) OOMs under
  # Node's default ~2 GB heap; give it more headroom.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/upgrade-version-check.mjs
      - run: npm run verify:preinstall
      - run: npm run lint:preinstall -- --strict
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build:exthost
      - run: npm --prefix extension-host run smoke
      - run: npm run build
      - run: node scripts/perf-harness.mjs

  rust:
    name: Desktop host (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix extension-host run fetch-node
      - run: npm run build:exthost
      - run: npm run build
      - name: cargo clippy (workspace, deny warnings)
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
      - name: Print clippy diagnostics on failure
        if: failure()
        run: |
          echo "===== clippy errors/warnings ====="
          grep -E "error|warning" clippy.log | head -100 || true
          echo "===== clippy log tail ====="
          tail -60 clippy.log || true
          # Surface diagnostics as check-run annotations (readable without auth).
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("clippy.log").read_text(errors="replace")
          seen = set()
          for m in re.finditer(r"^([^\s:]+\.rs):(\d+):(\d+): (error|warning)(\[[^\]]+\])?: (.*)$", log, re.M):
              path, line, col, level, code, msg = m.groups()
              key = (path, line, msg)
              if key in seen:
                  continue
              seen.add(key)
              lvl = "error" if level == "error" else "warning"
              print(f"::{lvl} file={path},line={line},col={col},title=clippy{code or ''}::{msg}")
              if len(seen) >= 40:
                  break
          PY
      - name: Upload clippy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
          retention-days: 7
      - name: cargo test (workspace)
        env:
          AGENTZ_TEST_INMEMORY_KEYRING: "1"
        run: cargo test --workspace
