name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  RUST_BACKTRACE: 1
  # `vite build` of the heavy frontend (mermaid / monaco / katex) OOMs under
  # Node's default ~2 GB heap; give it more headroom.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/upgrade-version-check.mjs
      - run: npm run verify:preinstall
      - run: npm run lint:preinstall -- --strict
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build:exthost
      - run: npm --prefix extension-host run smoke
      - run: npm run build
      - run: node scripts/perf-harness.mjs

  rust:
    name: Desktop host (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix extension-host run fetch-node
      - run: npm run build:exthost
      - run: npm run build
      - name: cargo clippy (workspace, deny warnings)
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=json -- -D warnings > clippy.jsonl 2>&1 || true
          python3 - <<'PY'
          import json, pathlib, sys
          lines = pathlib.Path("clippy.jsonl").read_text(errors="replace").splitlines()
          failed = False
          count = 0
          for ln in lines:
              try:
                  m = json.loads(ln)
              except Exception:
                  continue
              if m.get("reason") == "compiler-message":
                  msg = m["message"]
                  if msg["level"] in ("error", "warning"):
                      failed = True
                      sp = msg["spans"][0] if msg["spans"] else {}
                      f, l, c = sp.get("file_name", "?"), sp.get("line_start", 1), sp.get("column_start", 1)
                      code = (msg.get("code") or {}).get("code", "")
                      text = msg["message"].replace("\n", " ")[:900]
                      print(f"::{msg['level']} file={f},line={l},col={c},title=clippy {code}::{text}")
                      count += 1
                      if count >= 50:
                          break
              elif m.get("reason") == "build-finished" and not m.get("success"):
                  failed = True
          if count == 0 and failed:
              print("::error title=clippy::no structured diagnostics; raw tail follows")
              for ln in lines[-40:]:
                  print(ln[:900])
          sys.exit(1 if failed else 0)
          PY
      - name: Upload clippy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.jsonl
          retention-days: 7
      - name: cargo test (workspace)
        env:
          AGENTZ_TEST_INMEMORY_KEYRING: "1"
        run: cargo test --workspace
